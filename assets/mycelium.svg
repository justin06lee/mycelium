<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350" role="img" aria-labelledby="t">
  <title id="t">mycelium</title>
  <!-- A mushroom is the part you see; underneath, hyphae run between the
       pieces of a codebase and keep them linked. Filled nodes are tracked
       components, the hollow one is code nobody has named yet. -->
  <rect x="0" y="0" width="400" height="350" rx="32" fill="#16130f"/>
  <rect x="0.5" y="0.5" width="399" height="349" rx="32" fill="none" stroke="#fff" stroke-opacity="0.07"/>

  <!-- soil -->
  <rect x="24" y="98" width="352" height="172" rx="18" fill="#1d1914"/>
  <path d="M24 99 Q 70 93 116 99 T 208 99 T 300 98 T 376 99" fill="none" stroke="#3b3229" stroke-width="2" stroke-linecap="round"/>

  <!-- mushroom -->
  <path d="M191 100 L 193 62 H 207 L 209 100 Z" fill="#efe4cf"/>
  <path d="M156 66 Q 156 24 200 24 Q 244 24 244 66 Z" fill="#d9a05b"/>
  <rect x="156" y="62" width="88" height="7" rx="3.5" fill="#b9853f"/>
  <circle cx="183" cy="42" r="5" fill="#efe4cf" fill-opacity="0.85"/>
  <circle cx="213" cy="36" r="3.5" fill="#efe4cf" fill-opacity="0.85"/>
  <circle cx="226" cy="52" r="3" fill="#efe4cf" fill-opacity="0.85"/>
  <circle cx="171" cy="57" r="2.5" fill="#efe4cf" fill-opacity="0.85"/>

  <!-- hyphae -->
  <g fill="none" stroke="#cbbd9f" stroke-linecap="round">
    <g stroke-width="3" stroke-opacity="0.8">
      <path d="M200 100 C 200 125 196 145 200 168"/>
      <path d="M200 168 C 170 160 140 150 112 140"/>
      <path d="M200 168 C 175 185 130 205 98 214"/>
      <path d="M200 168 C 190 200 175 225 166 244"/>
      <path d="M200 168 C 215 195 235 222 250 238"/>
      <path d="M200 168 C 235 175 275 190 304 204"/>
      <path d="M200 168 C 230 155 265 142 290 134"/>
    </g>
    <g stroke-width="1.6" stroke-opacity="0.45">
      <path d="M112 140 C 100 165 96 190 98 214"/>
      <path d="M304 204 C 290 222 270 232 250 238"/>
      <path d="M166 244 C 190 252 225 248 250 238"/>
      <path d="M112 140 C 90 128 66 126 46 132"/>
      <path d="M98 214 C 76 224 58 238 44 252"/>
      <path d="M290 134 C 315 122 338 118 356 122"/>
      <path d="M304 204 C 326 214 342 228 356 246"/>
      <path d="M166 244 C 160 252 150 258 138 262"/>
      <path d="M250 238 C 262 248 278 254 296 258"/>
    </g>
  </g>

  <!-- components -->
  <circle cx="200" cy="168" r="13" fill="#efe4cf"/>
  <circle cx="200" cy="168" r="5" fill="#16130f"/>
  <circle cx="112" cy="140" r="10" fill="#8fb48a"/>
  <circle cx="98" cy="214" r="9" fill="#7fa6b8"/>
  <circle cx="166" cy="244" r="10" fill="#c97b6b"/>
  <circle cx="250" cy="238" r="9" fill="#d9a05b"/>
  <circle cx="304" cy="204" r="10" fill="#8fb48a"/>
  <circle cx="290" cy="134" r="9" fill="none" stroke="#cbbd9f" stroke-width="2.5"/>

  <!-- wordmark -->
  <text x="200" y="316" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="34" font-weight="600" letter-spacing="1" fill="#efe4cf">mycelium</text>
</svg>
